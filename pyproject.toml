[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moveon"
version = "1.1.0"
description = "Extract your AI provider data. Request deletion. Move on."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "snuss"},
]
keywords = [
    "gdpr",
    "privacy",
    "ai",
    "data-export",
    "right-to-erasure",
    "chatgpt",
    "claude",
    "gemini",
    "data-portability",
    "dpa",
    "dsgvo",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moveon"]

[project.scripts]
moveon = "moveon.cli:app"

[project.urls]
Homepage = "https://github.com/ur-grue/move-on"
Issues = "https://github.com/ur-grue/move-on/issues"
Changelog = "https://github.com/ur-grue/move-on/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.13.0",
]
